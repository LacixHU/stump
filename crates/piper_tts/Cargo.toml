[package]
name = "piper_tts"
version.workspace = true
edition = "2021"
description = "In-process Piper neural text-to-speech (port of rhasspy/piper)"
# espeak-ng is compiled from the `espeak-ng` submodule and linked statically (GPL-3.0).
links = "espeak-ng"

[dependencies]
# Same version and features as tts_runtime, which owns the ONNX Runtime setup.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tts_runtime = { path = "../tts_runtime" }
unicode-normalization = "0.1.25"
zstd = "0.13"

[build-dependencies]
cc = "1.4"
zstd = "0.13"
